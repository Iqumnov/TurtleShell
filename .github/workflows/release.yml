name: Release TurtleShell

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.1.2)'
        required: true

permissions:
  contents: write

jobs:
  build-assets:
    name: Build Frontend & Python Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install & Build Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter turtleshell-live-frontend build
          tar -czvf turtleshell-live-frontend-dist.tar.gz -C packages/turtleshell-live/frontend dist

      - name: Set up Python & Build QIB Package
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Python sdist & wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist packages/quantum-isolation-benchmark

      - name: Generate SHA256SUMS.txt
        run: |
          mkdir -p release-assets
          mv turtleshell-live-frontend-dist.tar.gz dist/* release-assets/
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
