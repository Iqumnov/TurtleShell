[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-isolation-benchmark"
version = "1.0.0"
description = "A benchmarking framework to audit process isolation in quantum clouds"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Matvei D. Igumnov", email = "matvei@iqumnov.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "networkx>=3.0",
    "qiskit>=1.0.0",
    "qiskit-aer>=0.14.0"
]

[project.optional-dependencies]
viz = [
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "requests>=2.28.0"
]
verification = [
    "qutip>=5.0.0"
]
dev = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
    "black>=23.0.0"
]
providers = [
    "cirq>=1.2.0",
    "azure-quantum>=0.28.0",
    "amazon-braket-sdk>=1.50.0",
    "pytket-quantinuum>=0.20.0"
]

[project.scripts]
qib = "quantum_isolation_benchmark.cli:main"
